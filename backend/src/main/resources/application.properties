spring.application.name=world-garage-backend
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set true behind HTTPS in production; local HTTP development needs false.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.datasource.url=jdbc:h2:file:./data/worldgarage
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.security.user.name=${WORLD_GARAGE_ADMIN_USERNAME:admin}
spring.security.user.roles=ADMIN
